<!DOCTYPE html>
<html>

<head>

<title>Documents</title>

</head>

<body>

<h1>Uploaded Documents</h1>

<table border="1">

<tr>

<th>ID</th>
<th>Title</th>
<th>Content</th>

</tr>

{% for d in documents %}

<tr>

<td>{{d.id}}</td>

<td>{{d.title}}</td>

<td>{{d.content}}</td>

</tr>

{% endfor %}

</table>

</body>

</html>
